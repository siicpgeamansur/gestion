<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suivi des compétences · Français-Philosophie (PCSI/PSI)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
  --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;
  --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;
  --ok-soft:rgba(30,122,46,.15);--warn-soft:rgba(154,91,0,.14);--bad-soft:rgba(192,40,31,.13);
  --overlay:rgba(10,16,22,.55);--shadow:rgba(0,0,0,.28);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#14181d;--bar:#1d232a;--panel:#191e24;--panel2:#212830;--field:#14181d;--line:#3b4551;
  --fg:#e8ecf0;--muted:#9ba6b2;--accent:#5b9bd5;--accent-fg:#0b1620;--accent-soft:#203449;--accent-ink:#b3d4f2;
  --ok:#62c673;--warn:#e3a94f;--bad:#f2766d;
  --ok-soft:rgba(98,198,115,.18);--warn-soft:rgba(227,169,79,.17);--bad-soft:rgba(242,118,109,.17);
  --overlay:rgba(0,0,0,.65);--shadow:rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
:is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg .cnt{font:500 11px var(--font-mono);opacity:.8}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.small{font-size:12px;color:var(--muted);margin:0 0 9px}
.mono{font-family:var(--font-mono);font-size:12.5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:90vw}
#dlg{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlgbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:88%;display:flex;flex-direction:column}
.dlgbox header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgbox header b{font-size:16px}
.dlgbox .dbody{padding:14px 16px;overflow:auto}
.dlgbox h3{margin:14px 0 4px;font-size:14px}.dlgbox p,.dlgbox li{margin:4px 0;font-size:13.5px}
.dlgbox textarea{width:100%;min-height:96px;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:12px/1.5 var(--font-mono);resize:vertical}
#act{flex:none;width:clamp(290px,25vw,350px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
#act .pbody{font-size:13.5px}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.todo{display:flex;flex-direction:column;gap:5px;margin:8px 0 0}
.todo button{display:flex;gap:8px;align-items:baseline;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 8px;cursor:pointer;font-size:13px}
.todo button:hover{border-color:var(--accent)}
.todo .tt{flex:1;min-width:0}
.todo .where{display:block;font-size:11.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}
#ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 34px;max-width:1000px}
#ws h2{font-size:24px;margin:0 0 6px;text-wrap:balance}
#ws h3{font-size:16.5px;margin:26px 0 6px;text-wrap:balance}
#ws p{font-size:14.5px;line-height:1.55;margin:4px 0 8px}
.lead{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.filters{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;align-items:center;margin:10px 0 4px}
.filters .lbl{font-size:12.5px;color:var(--muted)}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0 8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}.stat b{font-size:15px;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)}.bar .b-warn{background:var(--warn)}.bar .b-bad{background:var(--bad)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.6px solid var(--line);vertical-align:-2px;margin-right:5px;background:var(--panel2)}
.leg i.ok{background:var(--ok-soft);border-color:var(--ok)}.leg i.warn{background:var(--warn-soft);border-color:var(--warn)}.leg i.bad{background:var(--bad-soft);border-color:var(--bad)}
.leg i.none{border-style:dashed}
.grp{margin:20px 0 0}
.grp>h3{display:flex;align-items:baseline;gap:10px;margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line);font-size:15.5px}
.grp>h3 .n{font:500 12px var(--font-mono);color:var(--muted)}
.comp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:0 0 7px;background:var(--panel)}
.comp.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
.chead{display:flex;gap:8px;align-items:baseline;min-width:0}
.cid{flex:none;font:500 12px var(--font-mono);padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--panel2)}
.comp[data-l="1"] .cid{background:var(--bad-soft);border-color:var(--bad)}
.comp[data-l="2"] .cid{background:var(--warn-soft);border-color:var(--warn)}
.comp[data-l="3"] .cid{background:var(--ok-soft);border-color:var(--ok)}
.ctext{font-size:14px;font-weight:500;min-width:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:11.5px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:10px;padding:0 7px}
.rate{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:start}
.rate button{border:0;background:var(--panel);padding:6px 11px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.rate button+button{border-left:1px solid var(--line)}
.rate button:hover{background:var(--panel2)}
.rate button[aria-pressed="true"][data-l="1"]{background:var(--bad);color:var(--bg)}
.rate button[aria-pressed="true"][data-l="2"]{background:var(--warn);color:var(--bg)}
.rate button[aria-pressed="true"][data-l="3"]{background:var(--ok);color:var(--bg)}
.comp details{grid-column:1/-1;font-size:13px}
.comp summary{cursor:pointer;color:var(--accent-ink);font-weight:500;width:max-content;max-width:100%}
.comp ul{margin:6px 0 4px;padding-left:20px}.comp li{margin:2px 0;font-size:13px;color:var(--muted)}
.note{display:flex;gap:8px;align-items:center;margin-top:6px}
.note span{font-size:12px;color:var(--muted);flex:none}
.note input{flex:1;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.brow{display:grid;grid-template-columns:minmax(120px,210px) 1fr auto;gap:10px;align-items:center;padding:5px 0;border:0;background:none;width:100%;text-align:left;cursor:pointer;border-radius:6px}
.brow:hover{background:var(--panel2)}
.brow .nm{font-size:13.5px;font-weight:500;min-width:0}
.brow .ct{min-width:58px;text-align:right;font:12px var(--font-mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px;margin:6px 0 4px}
.tile{border:1px solid var(--line);border-style:dashed;background:var(--panel2);border-radius:5px;padding:4px 0;font:500 11.5px var(--font-mono);text-align:center;cursor:pointer;color:var(--fg)}
.tile[data-l="1"]{background:var(--bad-soft);border:1px solid var(--bad)}
.tile[data-l="2"]{background:var(--warn-soft);border:1px solid var(--warn)}
.tile[data-l="3"]{background:var(--ok-soft);border:1px solid var(--ok)}
.tile:hover{outline:2px solid var(--accent);outline-offset:1px}
.mapdom{font-size:12.5px;font-weight:600;margin:12px 0 2px;color:var(--muted)}
@media (max-width:820px){
  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
  .work{flex-direction:column;gap:8px}
  .comp{grid-template-columns:minmax(0,1fr)}
  .rate{width:100%}.rate button{flex:1;padding:8px 4px}
  .brow{grid-template-columns:1fr auto}.brow .bar{grid-column:1/-1;grid-row:2}
  .filters{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}
@media (prefers-reduced-motion:reduce){.comp.flash{animation:none;box-shadow:0 0 0 3px var(--accent)}}
</style>
</head>
<body>
<div id="app">
  <header class="band"><div class="inner row">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="2" width="22" height="22" fill="none" stroke="var(--fg)" stroke-width="1.6"/><rect x="6" y="6" width="14" height="14" fill="none" stroke="var(--accent)" stroke-width="1.6"/><rect x="9.5" y="9.5" width="7" height="7" fill="none" stroke="var(--ok)" stroke-width="1.6"/><rect x="12" y="12" width="2" height="2" fill="var(--warn)"/></svg>
      <span>Suivi des compétences <small>Français-Philosophie · PCSI / PSI</small></span>
    </div>
    <div class="files">
      <button class="btn" id="bAct" type="button" aria-pressed="false">Mon bilan</button>
      <button class="btn" id="bTheme" type="button" aria-pressed="false">Mode sombre</button>
      <button class="btn" id="bSave" type="button">Sauvegarde</button>
      <button class="btn" id="bHelp" type="button">Aide</button>
    </div>
  </div></header>
  <div class="band" id="modes"><div class="inner row"><div class="seg" id="wsSeg" role="tablist" aria-label="Thématiques"></div></div></div>
  <main class="inner work" id="work">
    <section id="stage"><div id="hint"></div><div id="scroller"><div id="ws"></div></div></section>
    <aside id="act" hidden aria-label="Mon bilan"></aside>
  </main>
</div>
<div id="dlg" hidden></div>
<div id="toast" hidden></div>

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEY = 'suivi-competences-francais-philo-pcsi-psi-v1';
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }

/* ---------- compétences Français-Philosophie (CPGE scientifiques) ---------- */
const DATA = {
  dom: {
    RES: 'Résumé / contraction',
    DIS: 'Dissertation',
    ANA: 'Analyse des œuvres',
    CUL: 'Culture et réflexion',
    EXP: 'Expression et argumentation'
  },
  themes: [
    {
      key: 'resume',
      title: 'Méthodologie du résumé',
      axes: ['Compréhension et reformulation', 'Rigueur formelle'],
      items: [
        { id: 'RES-01', ax: [0] }, { id: 'RES-02', ax: [0] }, { id: 'RES-03', ax: [0] },
        { id: 'RES-04', ax: [1] }, { id: 'RES-05', ax: [1] }, { id: 'RES-06', ax: [1] }
      ]
    },
    {
      key: 'dissertation',
      title: 'Méthodologie de la dissertation',
      axes: ['Problématisation et plan', 'Rédaction et argumentation'],
      items: [
        { id: 'DIS-01', ax: [0] }, { id: 'DIS-02', ax: [0] }, { id: 'DIS-03', ax: [0] },
        { id: 'DIS-04', ax: [1] }, { id: 'DIS-05', ax: [1] }, { id: 'DIS-06', ax: [1] }, { id: 'DIS-07', ax: [1] }
      ]
    },
    {
      key: 'oeuvres',
      title: 'Analyse des œuvres et du thème',
      axes: ['Connaissance des œuvres', 'Exploitation du thème'],
      items: [
        { id: 'OEUV-01', ax: [0] }, { id: 'OEUV-02', ax: [0] }, { id: 'OEUV-03', ax: [0] },
        { id: 'OEUV-04', ax: [1] }, { id: 'OEUV-05', ax: [1] }, { id: 'OEUV-06', ax: [1] }
      ]
    },
    {
      key: 'culture',
      title: 'Culture et réflexion philosophique',
      axes: ['Culture générale', 'Réflexion personnelle'],
      items: [
        { id: 'CUL-01', ax: [0] }, { id: 'CUL-02', ax: [0] },
        { id: 'CUL-03', ax: [1] }, { id: 'CUL-04', ax: [1] }
      ]
    },
    {
      key: 'expression',
      title: 'Expression écrite et orale',
      axes: ['Maîtrise de la langue', 'Qualités rhétoriques'],
      items: [
        { id: 'EXP-01', ax: [0] }, { id: 'EXP-02', ax: [0] }, { id: 'EXP-03', ax: [0] },
        { id: 'EXP-04', ax: [1] }, { id: 'EXP-05', ax: [1] }
      ]
    }
  ],
  comps: {
    /* Méthodologie du résumé */
    'RES-01': { t: 'Lire un texte argumentatif et en dégager la thèse, les étapes et la structure logique.', k: ['Textes de 1 400 à 1 800 mots environ.', 'Repérage des connecteurs, des exemples et des concessions.'], s: 'S1', d: 'RES' },
    'RES-02': { t: 'Reformuler fidèlement les idées d’un texte sans en trahir le sens ni la nuance.', k: ['Fidélité au sens, concision, neutralité.'], s: 'S1', d: 'RES' },
    'RES-03': { t: 'Hiérarchiser les idées et distinguer l’essentiel de l’accessoire.', k: [], s: 'S1', d: 'RES' },
    'RES-04': { t: 'Respecter la contrainte de longueur (nombre de mots imposé).', k: ['Résumé en 180 mots (ou équivalent selon les concours).'], s: 'S2', d: 'RES' },
    'RES-05': { t: 'Utiliser une langue correcte, précise et neutre dans le résumé.', k: ['Pas de citations, pas de commentaire personnel.'], s: 'S2', d: 'RES' },
    'RES-06': { t: 'S’entraîner sur des textes de difficulté croissante en temps limité.', k: [], s: 'S3', d: 'RES' },

    /* Méthodologie de la dissertation */
    'DIS-01': { t: 'Analyser un sujet de dissertation et en dégager la problématique.', k: ['Sujet portant sur le thème et les œuvres au programme.', 'Reformulation, présupposés, enjeux.'], s: 'S1', d: 'DIS' },
    'DIS-02': { t: 'Construire un plan structuré (thèse, antithèse, dépassement ou plan thématique).', k: ['Plan en deux ou trois parties, sous-parties équilibrées.'], s: 'S1', d: 'DIS' },
    'DIS-03': { t: 'Rédiger une introduction qui pose le sujet, la problématique et annonce le plan.', k: ['Accroche, définition des termes, problématisation, annonce du plan.'], s: 'S2', d: 'DIS' },
    'DIS-04': { t: 'Développer des arguments illustrés par des exemples précis tirés des œuvres.', k: ['Citations exactes, références aux œuvres.', 'Articulation argument–exemple.'], s: 'S2', d: 'DIS' },
    'DIS-05': { t: 'Rédiger une conclusion qui répond à la problématique et ouvre une perspective.', k: ['Bilan, réponse claire, ouverture.'], s: 'S3', d: 'DIS' },
    'DIS-06': { t: 'Gérer le temps de l’épreuve (4 heures pour résumé et dissertation, ou 3 heures pour une dissertation seule).', k: ['Centrale-Supélec, CCINP, X-ENS : 4 h.', 'Mines-Ponts : 3 h.'], s: 'S3', d: 'DIS' },
    'DIS-07': { t: 'Confronter les œuvres du programme pour nourrir une réflexion personnelle.', k: ['Analyse comparée des œuvres au regard du thème.'], s: 'S3', d: 'DIS' },

    /* Analyse des œuvres et du thème */
    'OEUV-01': { t: 'Connaître le contenu, la structure et les personnages des œuvres au programme.', k: ['Une œuvre philosophique et deux ou trois œuvres littéraires selon l’année.'], s: 'S1', d: 'ANA' },
    'OEUV-02': { t: 'Identifier les thèses philosophiques portées par les œuvres.', k: [], s: 'S1', d: 'ANA' },
    'OEUV-03': { t: 'Replacer les œuvres dans leur contexte historique, littéraire et philosophique.', k: [], s: 'S2', d: 'ANA' },

/* ---------- une thématique ---------- */

function compEl(id, t, it) {

  const inp = h('input', { type: 'text', id: 'note-' + t.key + '-' + id, maxlength: 200, placeholder: 'Ex. refaire un résumé, revoir le plan type', value: S.n[id] || '', 'aria-label': 'Note personnelle ' + id });
  inp.addEventListener('input', () => { if (inp.value.trim()) S.n[id] = inp.value; else delete S.n[id]; save(); });

function updateTop(t) {
  const box = $('#top'); if (!box) return;
  const c = tally(idsOf(t)); box.innerHTML = '';

function mountTheme(root, t) {
  root.append(h('h2', null, t.title), h('p', { class: 'lead' }, INFO[t.key]), h('div', { id: 'top' }));
  updateTop(t);
  const f = h('div', { class: 'filters' });
  f.append(h('span', { class: 'lbl' }, 'Semestre'), chipRow([['all', 'Tous'], ['S1', 'S1'], ['S2', 'S2'], ['S3', 'S3']], F.sem, v => { F.sem = v; mountWs(); }, 'Semestre'));
  f.append(h('span', { class: 'lbl' }, 'Mon niveau'), chipRow([['all', 'Tous'], ['todo', 'À travailler'], ['3', 'Acquises'], ['0', 'Non évaluées']], F.st, v => { F.st = v; mountWs(); }, 'Niveau'));
  if (t.axes.length) f.append(h('span', { class: 'lbl' }, 'Chapitre'), chipRow([[-1, 'Tous']].concat(t.axes.map((a, i) => [i, a])), F.ax, v => { F.ax = v; mountWs(); }, 'Chapitre'));
  root.append(f);
  const keep = it => {
    const c = COMPS[it.id], l = lvl(it.id);
    if (F.sem !== 'all' && c.s !== F.sem) return false;
    if (F.st === 'todo' && !(l === 1 || l === 2)) return false;
    if (F.st === '3' && l !== 3) return false;
    if (F.st === '0' && l !== 0) return false;
    if (F.ax >= 0 && !it.ax.includes(F.ax)) return false;
    return true;
  };
  const groups = [];
  if (t.axes.length) t.axes.forEach((a, i) => groups.push({ name: a, items: t.items.filter(it => it.ax[0] === i && keep(it)) }));
  else {
    Object.keys(DOM).forEach(d => {
      const items = t.items.filter(it => COMPS[it.id].d === d && keep(it));
      if (items.length) groups.push({ name: d + ' · ' + DOM[d], items });
    });
  }
  const noax = t.axes.length ? t.items.filter(it => !it.ax.length && keep(it)) : [];
  if (noax.length) groups.push({ name: 'Autres', items: noax });
  let shown = 0;
  groups.forEach(g => {
    if (!g.items.length) return;

    const sec = h('section', { class: 'grp' },
      h('h3', null, g.name, h('span', { class: 'n' }, g.items.length + (g.items.length > 1 ? ' compétences' : ' compétence'))));

    root.append(sec);
  });
  if (!shown) root.append(h('p', { class: 'empty' }, 'Aucune compétence ne correspond à ces filtres.'));
}

(function () {
  let t = 'light';
  try { if (localStorage.getItem(KEY + '-theme') === 'dark') t = 'dark'; } catch (e) { /* stockage indisponible */ }
  applyTheme(t);
})();
$('#bTheme').addEventListener('click', () => {
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(t);
  try { localStorage.setItem(KEY + '-theme', t); } catch (e) { /* stockage indisponible */ }
});

(function init() {
  AS.open = !isSmall();
  renderSeg();
  mountWs();
  renderAct();
})();
</script>
